<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY CRM</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="MY CRM" />
  <meta name="apple-mobile-web-app-title" content="MY CRM" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=317" />
</head>
<body>
  <div class="shell">
    <div class="app">
      <aside class="sidebar" aria-label="Навігація">
        <nav class="nav-main" id="nav"></nav>
      </aside>

      <main class="main">
        <header class="header">
          <div class="brand">
            <div class="logo" aria-hidden="true">M</div>
            <div class="brand-text">
              <p class="brand-name" id="brandName">MY CRM</p>
              <p class="brand-user" id="brandUser">Чабанюк Владислав</p>
            </div>
          </div>
          <div class="header-tools">
            <label class="search">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3" stroke-linecap="round"/></svg>
              <input type="search" id="searchInput" placeholder="Пошук..." />
            </label>
            <div class="notifications-wrap">
              <button type="button" class="notifications-btn" id="notificationsBtn" aria-label="Сповіщення" aria-expanded="false" aria-haspopup="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                  <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M13.73 21a2 2 0 01-3.46 0" stroke-linecap="round"/>
                </svg>
                <span class="notifications-badge" id="notificationsBadge" hidden>0</span>
              </button>
              <div class="notifications-panel is-hidden" id="notificationsPanel" role="region" aria-labelledby="notificationsTitle">
                <div class="notifications-panel-head">
                  <h2 class="notifications-panel-title" id="notificationsTitle">Сповіщення</h2>
                </div>
                <div class="notifications-panel-body" id="notificationsContent"></div>
              </div>
            </div>
          </div>
        </header>

        <div id="content" class="content"></div>
        <p class="storage-hint" id="storageHint">Дані зберігаються локально у браузері</p>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="supabase-config.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="storage.js?v=203"></script>
  <script src="supabase-sync.js?v=2"></script>
  <script src="app.js?v=372"></script>
</body>
</html>
